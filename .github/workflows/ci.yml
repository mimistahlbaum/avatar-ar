name: CI

# Disabled to save GitHub Actions minutes. Run manually from the Actions tab if needed.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML
        run: html-validate avatar-ar.html index.html

      - name: Unit tests (hand features, bloom mapping, condition sets, export schema)
        run: node --test tests/*.test.js
